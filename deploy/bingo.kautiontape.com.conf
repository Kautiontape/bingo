# nginx site for bingo.kautiontape.com on ktn. This file is the source of truth: edit it
# here, then copy it to /etc/nginx/sites-available/bingo.kautiontape.com (symlinked into
# sites-enabled) and run `sudo nginx -t && sudo systemctl reload nginx`.

# Cloudflare fronts the site, so the connection address is the edge's. Pass the client
# Cloudflare reports (the app rate-limits on it), falling back to the connection address
# for anything that reaches the origin directly.
map $http_cf_connecting_ip $bingo_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name bingo.kautiontape.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bingo.kautiontape.com;
    include snippets/ssl-kautiontape.conf;

    client_max_body_size 128k;

    # The bingo container (Kautiontape/bingo, docker-compose.yml) serves the page, static
    # files and the API. It sets its own Cache-Control headers.
    location / {
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bingo_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates (Server-Sent Events): stream straight through and keep the connection
    # open. The app sends a heartbeat every 25s, under Cloudflare's ~100s idle cutoff.
    location ~ ^/api/boards/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $bingo_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
